<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>えいけんタウン | 英検4級クエスト</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23ffe1ee'/><rect x='4' y='4' width='56' height='56' rx='11' fill='none' stroke='%23f06ba3' stroke-width='3'/><text x='32' y='47' font-size='36' text-anchor='middle'>🏙️</text></svg>">
<meta name="theme-color" content="#f06ba3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="えいけんタウン">
<link rel="manifest" href='data:application/manifest+json,{"name":"えいけんタウン","short_name":"えいけんタウン","start_url":".","display":"standalone","orientation":"any","background_color":"%23fef6fb","theme_color":"%23f06ba3"}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --pink:#ff9ec4;
  --pink-d:#f06ba3;
  --pink-l:#ffe1ee;
  --mint:#6fd6b8;
  --mint-d:#2fae8d;
  --mint-l:#dcf7ef;
  --lav:#a98ef5;
  --lav-d:#8465dd;
  --lav-l:#ece4ff;
  --sun:#ffcf56;
  --sun-d:#e8a913;
  --sun-l:#fff3d6;
  --sky:#bfe7ff;
  --ink:#5c4553;
  --ink-soft:#93788a;
  --paper:#fffdfa;
  --line:#ffd9e8;
  --shadow:0 10px 24px rgba(240,107,163,.16);
  --radius:24px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{
  min-height:100%;
  font-family:'Zen Maru Gothic',sans-serif;
  color:var(--ink);
  overscroll-behavior-y:contain;
  -webkit-user-select:none;user-select:none;
  background:
   radial-gradient(circle at 12% 18%,rgba(255,158,196,.14),transparent 34%),
   radial-gradient(circle at 86% 8%,rgba(169,142,245,.14),transparent 30%),
   radial-gradient(circle at 78% 82%,rgba(111,214,184,.16),transparent 36%),
   linear-gradient(180deg,#dff0ff 0%,#fef6fb 42%,#fdfbf5 100%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}
input,textarea{-webkit-user-select:text;user-select:text}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
button:disabled{cursor:not-allowed}

#app{max-width:1160px;margin:0 auto;padding:14px 14px 90px;position:relative}

.appbar{
  position:sticky;top:10px;z-index:50;
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-radius:999px;
  background:rgba(255,253,250,.92);
  border:3px solid var(--line);
  box-shadow:var(--shadow);
  backdrop-filter:blur(6px);
}
.appbar .logo-mini{font-weight:900;font-size:19px;color:var(--pink-d);letter-spacing:.04em;white-space:nowrap}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:999px;font-weight:700;font-size:15px;
  background:var(--sun-l);border:2px solid #ffe6a8;color:#a97a00;white-space:nowrap;
}
.pill.minty{background:var(--mint-l);border-color:#bff0e2;color:var(--mint-d)}
.spacer{flex:1}
.iconbtn{
  width:44px;height:44px;border-radius:16px;font-size:21px;
  background:#fff;border:3px solid var(--line);box-shadow:0 4px 10px rgba(240,107,163,.12);
  transition:transform .15s;display:flex;align-items:center;justify-content:center;position:relative;
}
.iconbtn:hover{transform:translateY(-2px) rotate(-3deg)}
.iconbtn .badge{
  position:absolute;top:-4px;right:-3px;min-width:20px;height:20px;padding:0 5px;
  border-radius:999px;background:var(--pink-d);color:#fff;font-size:11px;font-weight:900;
  display:flex;align-items:center;justify-content:center;border:2px solid #fff;
}

.screen{display:none;animation:pop-in .35s ease}
.screen.active{display:block}
@keyframes pop-in{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

.panel{
  background:var(--paper);
  border:3px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:900;font-size:17px;letter-spacing:.03em;
  padding:14px 28px;border-radius:999px;
  border-bottom:5px solid rgba(0,0,0,.14);
  transition:transform .12s,filter .12s;
  user-select:none;
}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn:disabled{opacity:.45;filter:grayscale(.4)}
.btn.pinky{background:linear-gradient(180deg,#ffb1cd,var(--pink));color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.08)}
.btn.minty{background:linear-gradient(180deg,#8ce4c9,var(--mint));color:#0c5c47}
.btn.lavvy{background:linear-gradient(180deg,#c3adfa,var(--lav));color:#fff}
.btn.sunny{background:linear-gradient(180deg,#ffe08a,var(--sun));color:#8a5b00}
.btn.ghosty{background:#fff;color:var(--ink-soft);border:3px solid var(--line)}
.btn.big{font-size:21px;padding:18px 44px}
.btn.small{font-size:14px;padding:9px 18px;border-bottom-width:4px}

.title-hero{text-align:center;padding-top:34px}
.title-logo{
  font-size:min(15vw,84px);font-weight:900;line-height:1.05;
  background:linear-gradient(135deg,#ff7fb4 20%,#a98ef5 60%,#5fc9ec 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 #fff) drop-shadow(0 12px 18px rgba(240,107,163,.35));
  animation:bob 3.2s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.title-sub{font-size:19px;font-weight:700;color:var(--ink-soft);margin-top:6px}
.title-clouds{font-size:34px;letter-spacing:26px;animation:drift 6s linear infinite alternate}
@keyframes drift{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
.title-deco{font-size:40px;margin-top:18px;letter-spacing:10px}
.title-menu{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:30px}
.save-note{font-size:13px;color:var(--ink-soft);margin-top:10px}

.town-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 2px 10px}
.rank-card{display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--line);border-radius:999px;padding:8px 18px;box-shadow:var(--shadow)}
.rank-card .rk-emoji{font-size:26px}
.rank-card .rk-name{font-weight:900;font-size:17px;color:var(--pink-d)}

.lot{
  position:relative;aspect-ratio:1/1;border-radius:26px;
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.16) 0 12px,transparent 12px 24px),
    linear-gradient(160deg,#bfe9cf,#93dbb6);
  border:3px solid #ffffffcc;
  box-shadow:0 8px 18px rgba(47,174,141,.18), inset 0 -6px 0 rgba(0,0,0,.05);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;transition:transform .15s;overflow:hidden;cursor:pointer;
}
.lot:hover{transform:translateY(-4px) scale(1.02)}
.lot.empty::after{content:'🌱';font-size:22px;opacity:.75}
.lot.empty .plus{font-size:30px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.18);font-weight:900}
.lot .house{font-size:52px;line-height:1;filter:drop-shadow(0 4px 3px rgba(0,0,0,.14))}
.lot.built{background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.2) 0 12px,transparent 12px 24px),
    linear-gradient(160deg,#ffe6f1,#ffc9df);
  border-color:#fff;}
.lot .nameplate{
  margin-top:6px;background:#ffffffe8;border-radius:999px;padding:2px 12px;
  font-size:13px;font-weight:900;color:var(--ink);white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;
}
.lot.road{background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 8px,transparent 8px 20px),
  linear-gradient(160deg,#9a95a3,#7c7787);
  border-color:#fff}
.lot .stars{font-size:13px;letter-spacing:1px;height:16px}
.lot .lv-tag{
  position:absolute;top:8px;left:8px;background:var(--sun);color:#7a5200;
  font-size:11px;font-weight:900;border-radius:999px;padding:2px 8px;border:2px solid #fff;
}
.lot .newdot{
  position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;
  background:var(--pink-d);color:#fff;font-size:14px;font-weight:900;
  display:flex;align-items:center;justify-content:center;border:3px solid #fff;animation:pulse 1.2s infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.map-tip{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:12px}

.modal-root{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center;background:rgba(92,69,83,.4);backdrop-filter:blur(3px)}
.modal-root.open{display:flex}
.modal{
  width:100%;max-width:560px;max-height:86vh;overflow:auto;
  background:var(--paper);border:3px solid var(--line);border-bottom:none;
  border-radius:30px 30px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));
  box-shadow:0 -14px 40px rgba(92,69,83,.25);
  animation:slide-up .3s ease;
}
@media(min-height:760px){.modal-root.open{align-items:center}.modal{border-radius:30px;border-bottom:3px solid var(--line);margin:16px}}
@keyframes slide-up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:21px;font-weight:900;color:var(--pink-d);text-align:center;margin-bottom:4px}
.modal .sub{text-align:center;font-size:13px;color:var(--ink-soft);margin-bottom:16px}
.close-row{display:flex;justify-content:center;margin-top:18px;gap:10px;flex-wrap:wrap}

.bcard{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:#fff;border:3px solid var(--line);border-radius:20px;
  padding:13px 15px;margin-bottom:11px;transition:transform .13s,box-shadow .13s;
}
.bcard:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--shadow)}
.bcard:disabled{opacity:.55;filter:grayscale(.5)}
.bcard .bc-emoji{font-size:40px;width:58px;text-align:center;flex-shrink:0}
.bcard .bc-name{font-weight:900;font-size:17px}
.bcard .bc-desc{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
.bcard .bc-cost{margin-left:auto;font-weight:900;color:#b57d00;background:var(--sun-l);padding:5px 12px;border-radius:999px;border:2px solid #ffe6a8;font-size:13px;white-space:nowrap}
.bcard.locked .bc-cost{background:#f3eef5;color:var(--ink-soft);border-color:#e5dbe9}

.quiz-top{display:flex;align-items:center;gap:10px;margin:16px 0 12px;flex-wrap:wrap}
.q-building{font-weight:900;font-size:17px;color:var(--pink-d);background:var(--pink-l);border:2px solid var(--line);border-radius:999px;padding:6px 16px}
.dots{display:flex;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;background:#f1e3ea;border:2px solid #eccfdb;transition:all .25s}
.dot.done-ok{background:var(--mint);border-color:var(--mint-d)}
.dot.done-ng{background:#ff8f8f;border-color:#e06a6a}
.dot.now{background:var(--sun);border-color:var(--sun-d);transform:scale(1.25)}
.streak{margin-left:auto;font-weight:900;color:#e8590c;font-size:15px;background:#fff1e1;padding:4px 12px;border-radius:999px;border:2px solid #ffdcb0}

.qcard{padding:26px 22px;text-align:center}
.qcat-tag{display:inline-block;font-size:12px;font-weight:900;color:var(--lav-d);background:var(--lav-l);border-radius:999px;padding:3px 12px;margin-bottom:12px}
.qtext{font-size:min(5.6vw,27px);font-weight:700;line-height:1.55;white-space:pre-line}
.qjp{font-size:15px;color:var(--ink-soft);margin-top:10px;font-weight:500}
.blank{display:inline-block;min-width:64px;border-bottom:3px dashed var(--pink-d);color:transparent;line-height:1}

.choices{display:grid;gap:11px;margin-top:16px}
.choice{
  text-align:left;font-weight:700;font-size:17px;
  background:#fff;border:3px solid var(--line);border-radius:18px;
  padding:14px 18px;transition:all .13s;display:flex;align-items:center;gap:10px;
}
.choice:hover:not(:disabled){border-color:var(--pink);transform:translateY(-2px);box-shadow:var(--shadow)}
.choice .ckey{
  width:32px;height:32px;border-radius:12px;background:var(--lav-l);color:var(--lav-d);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;flex-shrink:0;
}
.choice.ok{background:var(--mint-l);border-color:var(--mint);animation:shake-good .4s}
.choice.ng{background:#ffecec;border-color:#ff9d9d;animation:shake-bad .4s}
.choice:disabled{opacity:.92}
@keyframes shake-good{0%,100%{transform:none}40%{transform:scale(1.03)}}
@keyframes shake-bad{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}65%{transform:translateX(6px)}}

.speak-zone{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px}
.speak-btn{
  width:96px;height:96px;border-radius:50%;font-size:42px;
  background:linear-gradient(180deg,#c3adfa,#a98ef5);color:#fff;
  border-bottom:6px solid #6f4fd0;box-shadow:0 10px 22px rgba(132,101,221,.35);
  transition:transform .12s;
}
.speak-btn:active{transform:translateY(3px);border-bottom-width:2px}
.speak-btn.playing{animation:speak-pulse 1s infinite}
@keyframes speak-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.speak-hint{font-size:13px;color:var(--ink-soft)}
.pic-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:16px}
.pic{
  aspect-ratio:2/1.15;font-size:clamp(26px,6vw,40px);letter-spacing:2px;
  background:#fff;border:3px solid var(--line);border-radius:18px;
  display:flex;align-items:center;justify-content:center;transition:all .13s;
}
.pic:hover:not(:disabled){border-color:var(--pink);transform:translateY(-2px);box-shadow:var(--shadow)}
.pic.ok{background:var(--mint-l);border-color:var(--mint)}
.pic.ng{background:#ffecec;border-color:#ff9d9d}

.order-slots{
  min-height:64px;background:#fff;border:3px dashed var(--line);border-radius:18px;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
  padding:12px;margin-top:14px;
}
.order-slots .ph{color:#cdb6c3;font-size:14px;font-weight:700}
.chip{
  font-weight:700;font-size:16px;background:#fff;border:3px solid var(--lav-l);
  color:var(--lav-d);border-radius:999px;padding:8px 16px;transition:all .12s;
}
.chip:hover{border-color:var(--lav);transform:translateY(-2px)}
.chip.in-slot{background:var(--lav);border-color:var(--lav);color:#fff}
.chip:disabled{opacity:.35}
.order-bank{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:14px}

.feedback{
  margin-top:16px;border-radius:20px;padding:16px 18px;
  border:3px solid var(--mint);background:var(--mint-l);
  animation:pop-in .3s ease;
}
.feedback.bad{border-color:#ff9d9d;background:#fff0f0}
.fb-head{font-size:23px;font-weight:900;margin-bottom:6px}
.feedback.good .fb-head{color:var(--mint-d)}
.feedback.bad .fb-head{color:#e05252}
.fb-exp{font-size:15px;line-height:1.65;font-weight:500}
.fb-next{display:flex;justify-content:center;margin-top:12px}

.writing-meta{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--ink-soft)}
#wr-count.over{color:var(--mint-d);font-weight:900}
textarea.writebox{
  width:100%;min-height:150px;resize:vertical;
  font-family:'Segoe UI','Zen Maru Gothic',sans-serif;font-size:17px;line-height:1.7;
  border:3px solid var(--line);border-radius:18px;padding:14px;background:#fffdf8;color:var(--ink);
}
textarea.writebox:focus{outline:none;border-color:var(--pink)}
.checklist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.checkrow{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:700;font-size:15px;cursor:pointer;transition:border-color .15s}
.checkrow input{width:22px;height:22px;accent-color:var(--pink-d)}
.checkrow.checked{border-color:var(--mint);background:var(--mint-l)}

.result-wrap{text-align:center;padding-top:30px}
.result-title{font-size:38px;font-weight:900;color:var(--pink-d)}
.stars-big{font-size:52px;letter-spacing:6px;margin:10px 0}
.coin-gain{
  display:inline-flex;align-items:center;gap:8px;font-size:26px;font-weight:900;color:#b57d00;
  background:var(--sun-l);border:3px solid #ffe6a8;border-radius:999px;padding:10px 26px;margin-top:6px;
}
.res-detail{margin:16px auto 0;max-width:420px;text-align:left;font-size:15px;font-weight:700;color:var(--ink-soft)}
.res-detail div{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:2px dashed var(--line)}
.levelup-banner{
  margin:18px auto 0;max-width:480px;padding:18px;border-radius:24px;
  background:linear-gradient(135deg,#fff0f6,#f3edff);border:3px solid var(--lav-l);
  animation:pop-in .5s ease;
}
.levelup-banner .lu-t{font-size:24px;font-weight:900;color:var(--lav-d)}
.levelup-banner .lu-s{font-size:14px;color:var(--ink-soft);margin-top:4px}

.progress-wrap{margin:14px auto 0;max-width:460px}
.progress-label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink-soft)}
.progress-bar{height:18px;background:#f6ecf1;border-radius:999px;border:2px solid var(--line);overflow:hidden;margin-top:5px}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--lav));transition:width .8s ease}

.toast-root{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:#fff;border:3px solid var(--line);color:var(--ink);font-weight:700;font-size:15px;
  border-radius:999px;padding:10px 22px;box-shadow:var(--shadow);animation:toast-in .3s ease;white-space:nowrap;
}
@keyframes toast-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.confetti{position:fixed;top:-40px;z-index:500;font-size:24px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.6}}

.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:center}
.stat-chip{background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 16px;font-size:13px;font-weight:700;color:var(--ink-soft)}
.stat-chip b{color:var(--pink-d);font-size:16px}

.hidden{display:none!important}

#scene-wrap{position:relative;height:clamp(430px,calc(100vh - 240px),900px);height:clamp(430px,calc(100dvh - 240px),900px);margin-top:8px;border-radius:26px;overflow:hidden;border:3px solid var(--line);box-shadow:var(--shadow);background:linear-gradient(180deg,#bfe9ff,#eaf8ff 55%,#e2f5e6)}
#scene-wrap canvas{display:block;touch-action:none;cursor:grab}
#scene-canvas-host{position:absolute;inset:0}
#scene-wrap canvas:active{cursor:grabbing}
.scene-hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;background:rgba(255,255,255,.9);border:2px solid var(--line);border-radius:999px;padding:5px 16px;font-size:12.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.view-btns{position:absolute;top:44px;right:10px;z-index:6;display:flex;flex-direction:column;gap:8px}
.tiny-icon{width:38px;height:38px;border-radius:13px;background:rgba(255,255,255,.95);border:2px solid var(--line);font-size:17px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(240,107,163,.14);transition:transform .15s}
.tiny-icon:hover{transform:translateY(-2px) rotate(-4deg)}
.build-fab{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6}
.place-bar{position:absolute;left:8px;right:8px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:7;display:flex;gap:10px;align-items:center;justify-content:center;background:rgba(255,253,250,.97);border:3px solid var(--sun);border-radius:999px;padding:8px 10px 8px 14px;font-weight:900;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 16px);margin:0 auto;pointer-events:none}
.place-bar>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto;min-width:0}
.place-bar .place-emoji{flex:0 0 auto}
.place-bar .place-tip-short{display:none}
.place-bar .cancel{pointer-events:auto;background:#ffecec;border:2px solid #ffc9c9;color:#e05252;border-radius:999px;padding:6px 14px;font-weight:900;font-size:13px;flex:0 0 auto}
#scene-fallback{position:absolute;inset:0;padding:12px;overflow:auto;background:linear-gradient(180deg,#dff0ff,#fef6fb)}
#scene-fallback .fb-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media(max-width:520px){#scene-fallback .fb-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.town-head-v2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 2px 10px}
.nameplate-main{display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--line);border-radius:999px;padding:6px 8px 6px 20px;box-shadow:var(--shadow)}
.nameplate-main .nm{font-weight:900;font-size:19px;color:var(--pink-d);max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-chip{display:inline-flex;align-items:center;gap:6px;background:var(--mint-l);border:2px solid #bff0e2;border-radius:999px;padding:9px 16px;font-weight:900;color:var(--mint-d);font-size:14.5px}
.name-input{font-family:inherit;font-size:17px;font-weight:900;border:3px solid var(--line);border-radius:14px;padding:11px 14px;width:100%;background:#fff;color:var(--ink)}
.name-input:focus{outline:none;border-color:var(--pink)}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
.sugg button{background:var(--lav-l);border:2px solid #ddd0f5;color:var(--lav-d);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}

@media(max-width:600px){
 .appbar{padding:8px 10px;gap:6px;top:6px}
 .logo-mini{font-size:0;letter-spacing:0}
 .logo-mini::before{content:'🌸';font-size:20px}
 .pill{font-size:13px;padding:5px 10px}
 #coin-pill{max-width:34vw;overflow:hidden}
 .iconbtn{width:38px;height:38px;font-size:17px;border-radius:12px}
 #sound-btn{display:none}
 #app{padding:10px 10px 80px}
 .nameplate-main{padding:5px 7px 5px 14px}
 .nameplate-main .nm{font-size:16px;max-width:34vw}
 .rank-chip{font-size:12.5px;padding:7px 12px}
 .town-head-v2{margin-top:12px}
 .panel{padding:16px}
 .qcard{padding:20px 14px}
 .choice{font-size:15.5px;padding:13px 14px}
 .btn.big{font-size:19px;padding:16px 32px}
 .result-title{font-size:30px}
 .stars-big{font-size:42px}
 .view-btns{top:auto;bottom:calc(70px + env(safe-area-inset-bottom));right:10px;flex-direction:row}
}
@media(max-width:480px){
 .title-hero{padding-top:8px}
 .title-logo{font-size:min(12vw,64px)}
 .title-sub{font-size:15px;padding:0 6px}
 .title-clouds{font-size:24px;letter-spacing:10px}
 .title-deco{font-size:30px;letter-spacing:5px;margin-top:12px}
 .save-note{font-size:11.5px;padding:0 4px}
 .title-menu{margin-top:20px;gap:11px;width:100%}
 .title-menu .btn{max-width:92%}
 .place-bar{font-size:13px;padding:7px 8px 7px 12px;gap:7px}
 .place-bar .place-tip{display:none}
 .place-bar .place-tip-short{display:inline}
 .place-bar .cancel{padding:5px 11px;font-size:12px}
}
</style>
</head>
<body>
<div id="app">

  <header class="appbar hidden" id="appbar">
    <span class="logo-mini">🌸えいけんタウン</span>
    <span class="pill" id="coin-pill">💰 <span id="coin-num">0</span></span>
    <span class="pill minty hidden" id="streak-pill">🔥 <span id="streak-num">0</span></span>
    <span class="spacer"></span>
    <button class="iconbtn" id="settings-btn" title="せってい">⚙️</button>
    <button class="iconbtn" id="sound-btn" title="効果音">🔔</button>
    <button class="iconbtn" id="review-btn" title="ふくしゅう">📖<span class="badge hidden" id="review-badge">0</span></button>
    <button class="iconbtn hidden" id="home-btn" title="まちへもどる">🏠</button>
  </header>

  <section class="screen active" id="scr-title">
    <div class="title-hero">
      <div class="title-clouds">☁️ 🌈 ☁️ ☁️ ☁️</div>
      <h1 class="title-logo">えいけんタウン</h1>
      <p class="title-sub">クイズに答えて、街を育てよう!</p>
      <div class="title-deco">🏫 📚 ☕ 🚉 🌳 💐</div>
      <div class="title-menu">
        <button class="btn pinky big" id="start-btn">▶️ はじめる!</button>
        <button class="btn ghosty small hidden" id="reset-btn-top">💾 データをけして最初から</button>
        <button class="btn ghosty small" id="how-btn-title">❓ 遊び方をみる</button>
        <p class="save-note">英検4級の「たんご・ぶんぽう・かいわ・じゅんじょ・ちょうかい・さくぶん」をバランスよく練習できるよ。<br>進み具合は自動で保存されるよ(このブラウザの中に)</p>
      </div>
    </div>
  </section>

  <section class="screen" id="scr-town">
    <div class="town-head-v2">
      <div class="nameplate-main"><span style="font-size:22px">🏙️</span><span class="nm" id="town-name-label">ちいさな村</span><button class="iconbtn" id="rename-btn" style="width:36px;height:36px;font-size:15px;border-radius:12px" title="なまえをかえる">✏️</button></div>
      <div class="rank-chip"><span id="rank-emoji">🏘️</span><span id="rank-name">ちいさな村</span></div>
      <span class="spacer"></span>
      <div style="font-size:13px;color:var(--ink-soft);font-weight:700" id="town-stats"></div>
    </div>
    <div id="scene-wrap">
      <div class="scene-hint" id="scene-hint">🖱️ ドラッグ=まわす・ホイール/ピンチ=ズーム・建物タップ=クイズ</div>
      <div class="view-btns"><button class="tiny-icon" id="pan-toggle" title="いどう/かいてん">🖐️</button><button class="tiny-icon" id="cam-reset" title="視点をもどす">🎯</button></div>
      <button class="btn sunny small build-fab" id="build-open">🏗️ こうじする</button>
      <div id="scene-canvas-host"></div>
      <div id="scene-fallback" class="hidden"><div class="fb-grid" id="fb-grid"></div></div>
    </div>
    <div class="stat-row" id="stat-row"></div>
  </section>

  <section class="screen" id="scr-quiz">
    <div class="quiz-top">
      <span class="q-building" id="q-building">📚 図書館</span>
      <div class="dots" id="q-dots"></div>
      <span class="streak hidden" id="q-streak"></span>
    </div>
    <div class="panel qcard" id="q-card"></div>
    <div id="q-answer-zone"></div>
  </section>

  <section class="screen" id="scr-result">
    <div class="result-wrap panel" style="margin-top:16px">
      <h2 class="result-title" id="res-title">おつかれさま!</h2>
      <div class="stars-big" id="res-stars"></div>
      <div><span class="coin-gain">💰 +<span id="res-coins">0</span> コインゲット!</span></div>
      <div class="res-detail" id="res-detail"></div>
      <div class="progress-wrap hidden" id="res-progress-wrap">
        <div class="progress-label"><span id="res-progress-label"></span><span id="res-progress-num"></span></div>
        <div class="progress-bar"><div class="progress-fill" id="res-progress-fill" style="width:0%"></div></div>
      </div>
      <div class="levelup-banner hidden" id="levelup-banner">
        <div class="lu-t">🎉 レベルアップできそう!!</div>
        <div class="lu-s" id="levelup-text">まちにもどって建物をタップしてレベルアップしよう!</div>
      </div>
      <div class="close-row" style="margin-top:24px">
        <button class="btn pinky big" id="res-town-btn">🏠 まちへもどる</button>
      </div>
    </div>
  </section>

  <div class="modal-root" id="modal-root"><div class="modal" id="modal"></div></div>
  <div class="toast-root" id="toast-root"></div>

</div>
<script>
const QUESTIONS = {
library:[
{d:1,q:"My mother ___ dinner for us every evening.",c:["cooks","cook","cooked","cooking"],a:0,e:"「毎晩」の話で、主語が My mother(三人称単数)なので動詞に s をつけて cooks。「母は毎晩夕食を作ってくれる」。"},
{d:1,q:"I ___ to school by bus every day.",c:["go","goes","going","went"],a:0,e:"主語が I のとき一般動詞は原形のまま。「毎日バスで学校へ行く」。"},
{d:1,q:"She ___ TV last night.",c:["watched","watch","watches","watching"],a:0,e:"last night(ゆうべ)は過去を表す言葉なので過去形 watched を使う。"},
{d:1,q:"There ___ two cats in the garden.",c:["are","is","was","be"],a:0,e:"two cats と複数なので There are。is は単数のときに使う。"},
{d:1,q:"Look! The children ___ soccer in the park.",c:["are playing","play","plays","played"],a:0,e:"Look!(見て!)といっているときは、今まさにしていること=現在進行形 are playing。"},
{d:1,q:"Did you ___ your hands before lunch?",c:["wash","washed","washes","washing"],a:0,e:"Did を使った疑問文では動詞は原形にもどす(Did you wash ...?)。"},
{d:1,q:"Ken can ___ very fast.",c:["run","runs","ran","running"],a:0,e:"can(〜できる)のあとは動詞の原形を置く。"},
{d:1,q:"This book is ___ than that one.",c:["more interesting","interesting","most interesting","interestinger"],a:0,e:"than(〜より)でくらべているので比較級。長い単語の比較級は more をつける。"},
{d:1,q:"Mt. Fuji is ___ mountain in Japan.",c:["the highest","high","higher","highest"],a:0,e:"「日本でいちばん高い」のように一番を表すのは最上級 the highest。"},
{d:1,q:"How ___ water do you drink every day?",c:["much","many","old","long"],a:0,e:"water(水)は数えられない名詞なので How much。数えられるものは How many。"},
{d:1,q:"We have no bread. Let's go ___.",c:["shopping","shop","shopped","shops"],a:0,e:"「買い物に行く」は go shopping とセットで覚える。"},
{d:1,q:"My birthday is ___ October.",c:["in","on","at","of"],a:0,e:"月や年には in(10月に=in October)。日付には on、時刻には at。"},
{d:1,q:"Please turn ___ the light. It's dark here.",c:["on","off","in","up"],a:0,e:"暗いから電気をつける=turn on。消すは turn off。"},
{d:1,q:"A: ___ is that bag? B: It's 2,000 yen.",c:["How much","How many","How old","How long"],a:0,e:"値段を聞くときは How much(いくら)。"},
{d:1,q:"Winter is my favorite ___ of the year.",c:["season","month","day","week"],a:0,e:"一年の中で好きなのは season(季節)。month=月、week=週。"},
{d:1,q:"He plays tennis ___ weekends.",c:["on","in","at","for"],a:0,e:"on weekends(週末に)。曜日や特定の日には on を使う。"},
{d:2,q:"She is good ___ playing the violin.",c:["at","in","for","of"],a:0,e:"「〜が得意」は be good at 〜ing とセット。"},
{d:2,q:"Thank you ___ helping me with my homework.",c:["for","to","of","with"],a:0,e:"「〜してくれてありがとう」= Thank you for 〜ing。"},
{d:2,q:"I'm looking ___ my cat. She's lost!",c:["for","at","after","up"],a:0,e:"「探している」= look for。look at はただ「見る」。"},
{d:2,q:"If it rains tomorrow, we ___ stay home.",c:["will","did","are","be"],a:0,e:"if(もし〜なら)の文で未来のことは will を使って表す。"},
{d:2,q:"You look tired. You ___ go to bed early tonight.",c:["should","must not","can't","would not"],a:0,e:"アドバイスには should(〜したほうがいい)。"},
{d:2,q:"I enjoy ___ music in my room.",c:["listening to","listen to","to listening","listened"],a:0,e:"enjoy のあとは動名詞(-ing)。聴くは listen TO music なので to も忘れずに。"},
{d:2,q:"A: Whose bag is this? B: It's ___.",c:["mine","my","me","I"],a:0,e:"「私のもの」は所有代名詞 mine。my はあとに名詞(my bag)が必要。"},
{d:2,q:"How ___ is it from here to the station?",c:["far","long","much","many"],a:0,e:"距離を聞くのは How far。時間の長さなら How long。"},
{d:2,q:"I have lived in Kyoto ___ ten years.",c:["for","since","from","during"],a:0,e:"ten years のように期間を表すのは for。since は起点(2015年など)。"},
{d:2,q:"She enjoys playing the piano ___ her free time.",c:["in","on","at","to"],a:0,e:"ひまな時間=free time には in を使うのがふつう。"},
{d:2,q:"I was late ___ the heavy rain this morning.",c:["because of","because","so","if"],a:0,e:"because of のあとは名詞。because のあとは主語+動詞の文。"},
{d:2,q:"You ___ eat more vegetables. They are good for you.",c:["should","shouldn't","can't","won't"],a:0,e:"野菜は体にいいので should(食べたほうがいい)。shouldn't は反対の意味。"},
{d:2,q:"A: ___ do you play tennis? B: Twice a week.",c:["How often","How many","How much","How long"],a:0,e:"Twice a week(週2回)は回数=頻度なので How often。"},
{d:2,q:"My dream is ___ a doctor.",c:["to become","become","became","becomes"],a:0,e:"「医者になること」は to 不定詞の名詞的用法 to become。"},
{d:3,q:"The movie was so ___ that I cried at the end.",c:["sad","happy","funny","exciting"],a:0,e:"最後に泣いたのだから sad(かなしい)。文全体の意味から正しい形容詞を選ぼう。"},
{d:3,q:"If it ___ tomorrow, the game will be canceled.",c:["rains","will rain","rained","rain"],a:0,e:"if 節の中では未来のことでも現在形 rains を使うのがルール。"},
{d:3,q:"I don't know ___ to swim yet.",c:["how","what","where","who"],a:0,e:"「泳ぎ方」= how to swim。how to do で「〜のしかた」。"},
{d:3,q:"My mother asked me ___ the dishes.",c:["to wash","wash","washing","washed"],a:0,e:"ask 人 to do=人に〜するよう頼む。目的語のあとは to 不定詞。"},
{d:3,q:"You must ___ quiet in the library.",c:["be","is","are","being"],a:0,e:"must のあとは動詞の原形。quiet は形容詞なので be を使う。"},
{d:3,q:"Neither answer ___ right.",c:["is","are","were","be"],a:0,e:"neither(どちらも〜ない)は単数扱い。「どちらの答えも正しくない」。"},
{d:3,q:"She is looking forward to ___ you again.",c:["seeing","see","saw","be seeing"],a:0,e:"look forward to + 動名詞。「また会えるのを楽しみにしている」。to があっても -ing!"},
{d:3,q:"It's getting dark. Let's ___ home.",c:["go","to go","going","went"],a:0,e:"Let's(〜しよう)のあとは動詞の原形 go。"},
{d:3,q:"A: Must I bring my dictionary? B: No, you ___.",c:["don't have to","mustn't","can't","shouldn't"],a:0,e:"Must I 〜? の否定の答えは don't have to(持ってこなくていい)。mustn't は「〜してはいけない」なので注意!"},
{d:3,q:"Ken is ___ honest boy.",c:["an","a","the","one"],a:0,e:"honest の h は発音しないので音では母音ではじまる言葉。「アン オネスト ボーイ」だから an。"}
],
school:[
{d:1,q:"My brother ___ soccer after school every day.",c:["plays","play","playing","played"],a:0,e:"三人称単数(My brother)+習慣(every day)=三単現の s。"},
{d:1,q:"They ___ at the library yesterday afternoon.",c:["were","was","are","is"],a:0,e:"They に対する be 動詞の過去形は were。"},
{d:1,q:"What ___ you doing now?",c:["are","is","do","did"],a:0,e:"進行形は be + -ing。you には are。「今なにしてるの?」"},
{d:1,q:"I'm going to ___ my grandmother this weekend.",c:["visit","visited","visits","visiting"],a:0,e:"be going to + 動詞の原形で「〜するつもり」。"},
{d:1,q:"My sister ___ swim when she was three years old.",c:["could","can","may","must"],a:0,e:"3歳のとき(過去)にできていた=can の過去形 could。"},
{d:1,q:"___ does your school start?",c:["What time","How much","How many","Which"],a:0,e:"時刻を聞く疑問詞は What time。"},
{d:1,q:"___ quiet, please. The class is starting.",c:["Be","Is","Are","Being"],a:0,e:"命令文は動詞の原形ではじめる。quiet は形容詞なので Be quiet!(静かに!)" },
{d:1,q:"___ there a big station near your old house?",c:["Was","Were","Is","Are"],a:0,e:"old house(昔の家)=過去の話。a station は単数なので Was there。"},
{d:1,q:"This present is for Ken. Please give it to ___.",c:["him","he","his","she"],a:0,e:"前置詞 to のあとは目的格 him。"},
{d:1,q:"I bought a ___ bag yesterday.",c:["beautiful","beautifully","beauty","most beautiful"],a:0,e:"名詞 bag を説明するのは形容詞 beautiful。beautifully は動詞を修飾する副詞。"},
{d:1,q:"She sings very ___. Everyone likes her songs.",c:["well","good","nice","fine"],a:0,e:"動詞 sings を修飾するのは副詞 well(good の副詞形)。"},
{d:1,q:"How ___ students are there in your class?",c:["many","much","long","often"],a:0,e:"students は数えられる名詞なので How many。"},
{d:1,q:"I like dogs, ___ I don't like cats.",c:["but","and","or","so"],a:0,e:"好き/きらいで対比になっているので but(でも)。"},
{d:1,q:"She ___ a letter to her friend last week.",c:["wrote","write","written","writes"],a:0,e:"write の過去形は wrote。last week で過去。"},
{d:2,q:"I went to the station ___ my friend.",c:["to meet","meeting","met","meet"],a:0,e:"「会うために」目的の to 不定詞。"},
{d:2,q:"___ color do you like better, red or blue?",c:["Which","What","Who","Whose"],a:0,e:"2つの選択肢から選ばせる疑問詞は Which(どちら)。"},
{d:2,q:"The ___ tail is very long.",c:["cat's","cat","cats","of cat"],a:0,e:"「猫のしっぽ」は所有格 cat's tail。"},
{d:2,q:"Ken is two years ___ than his sister.",c:["older","oldest","more old","old"],a:0,e:"「数 + 比較級 + than」で「〜歳ぶん年上」。"},
{d:2,q:"Tom is as ___ as his father.",c:["tall","taller","tallest","more tall"],a:0,e:"as 原形 as で「同じくらい」。as tall as=父と同じくらいの身長。"},
{d:2,q:"You ___ play soccer in the street. It's dangerous.",c:["must not","don't have to","may","will"],a:0,e:"禁止は must not(〜してはいけない)。don't have to は「必要がない」。"},
{d:2,q:"I stayed home ___ I had a bad cold.",c:["because","but","or","though"],a:0,e:"風邪だった→家にいた。理由を表す because。"},
{d:2,q:"My hobby is ___ video games.",c:["playing","play","plays","played"],a:0,e:"be 動詞のあとで「〜すること」は動名詞(-ing)。"},
{d:2,q:"___ a nice day it is today!",c:["What","How","Which","Who"],a:0,e:"感嘆文 What a + 形容詞 + 名詞!(なんて良い天気!)How nice it is! とも言える。"},
{d:2,q:"___ your brother like pizza?",c:["Does","Do","Is","Did"],a:0,e:"your brother は三人称単数。Does ではじめたら動詞は原形 like へ。"},
{d:2,q:"My birthday is ___ March 3rd.",c:["on","in","at","by"],a:0,e:"日付があるときは on。月だけなら in March。"},
{d:2,q:"I have two pens. One is blue, and ___ is black.",c:["the other","other","another","others"],a:0,e:"2つのうち残りの1つ=the other。"},
{d:2,q:"There ___ a new shopping mall here next year.",c:["will be","was","were","are"],a:0,e:"next year は未来。There is の未来形は There will be。"},
{d:2,q:"She ___ goes jogging after dinner.",c:["usually","usual","useful","use"],a:0,e:"「たいてい」の頻度を表す usually は副詞。usual は形容詞。"},
{d:3,q:"I ___ dinner when the phone rang.",c:["was cooking","cooked","am cooking","cook"],a:0,e:"電話が鳴った「そのとき料理をしていた」=過去進行形 was cooking。"},
{d:3,q:"If you study harder, you ___ pass the test.",c:["will","would","did","are"],a:0,e:"if 節は現在形、もう一方の文に will。「勉強すれば合格するでしょう」。"},
{d:3,q:"She asked me ___ her with her homework.",c:["to help","helping","help","helped"],a:0,e:"ask 人 to do=人に〜するようたのむ。"},
{d:3,q:"The days are getting ___ in spring.",c:["longer and longer","long and long","more long","longest"],a:0,e:"比較級 and 比較級=「ますます」。「日がだんだん長くなる」。"},
{d:3,q:"Lake Biwa is the largest lake ___ Japan.",c:["in","of","on","between"],a:0,e:"最上級で範囲が場所なら in。of はグループ(the largest of all)。"},
{d:3,q:"___ were you doing at eight last night?",c:["What","Where","Who","When"],a:0,e:"過去進行形と組み合わせ「昨夜8時に何をしていましたか」。"},
{d:3,q:"Wait here ___ I come back.",c:["until","because","if","so"],a:0,e:"until(〜までずっと)。「戻ってくるまで待っていて」。"},
{d:3,q:"After ___ dinner, I take a short walk.",c:["eating","eat","ate","eaten"],a:0,e:"After が前置詞のときは動名詞(-ing)がくる。"},
{d:3,q:"Look! There are ten ___ in the field.",c:["sheep","sheeps","sheep's","a sheep"],a:0,e:"sheep(羊)は単数も複数も同じ形。sheeps はない!"},
{d:3,q:"___ is ready for the party. Let's start!",c:["Everything","All things is","Everyone","Every things"],a:0,e:"「すべて」= Everything は必ず単数扱い(Everything is)。Everyone は人にだけ使う。"},
{d:3,q:"Ken is ___ in his class.",c:["the tallest","taller","the taller","most tall"],a:0,e:"クラスで一番なら最上級 the tallest。比較級は2者を比べるとき。"},
{d:3,q:"___ did you stay in Kyoto last month?",c:["How long","How often","How far","How soon"],a:0,e:"「どのくらいの期間」は How long。How often は頻度、How far は距離。"}
],
cafe:[
{d:1,q:"A: Thank you for your help.\nB: ___",c:["You're welcome.","Here you are.","Yes, please.","No, thank you."],a:0,e:"「手伝ってくれてありがとう」には You're welcome.(どういたしまして)。Here you are. はものを渡すときの言葉。"},
{d:1,q:"A: How are you today?\nB: ___",c:["I'm fine, thank you.","I'm thirteen years old.","Yes, I am.","It's sunny today."],a:0,e:"調子を聞かれているので I'm fine.(元気だよ)と答える。"},
{d:1,q:"A: See you tomorrow!\nB: ___",c:["See you!","Me too.","Good night.","You're welcome."],a:0,e:"別れのあいさつは See you!(またね!)"},
{d:1,q:"A: I'm sorry I'm late.\nB: ___",c:["That's OK.","Of course.","Good idea.","Nice to meet you."],a:0,e:"謝られたら That's OK.(大丈夫だよ)と返すのが自然。"},
{d:1,q:"A: Let's play badminton after school.\nB: ___",c:["Sounds great!","I'm fine.","See you tomorrow.","You're right."],a:0,e:"誘いに乗るときは Sounds great!(いいね!)Let's の誘いには賛成の返事を。"},
{d:1,q:"A: What day is it today?\nB: ___",c:["It's Monday.","It's nine o'clock.","It's May 5th.","It's rainy."],a:0,e:"曜日を聞かれている。It's Monday.(月曜日)。時刻・日付・天気ではない。"},
{d:1,q:"A: Do you like ice cream?\nB: ___",c:["Yes, I love it.","Yes, I am.","Yes, it is.","No, I can't."],a:0,e:"Do you like 〜? への答えは Yes, I do./Yes, I love it. I am は be 動詞の質問への返事。"},
{d:1,q:"A: Where are you from?\nB: ___",c:["I'm from Australia.","I'm twelve years old.","I'm fine.","I'm a student."],a:0,e:"出身地を聞かれているので国や町の名前で答える。"},
{d:1,q:"A: What time is it now?\nB: ___",c:["It's half past three.","It's Monday.","It's March.","It's cold."],a:0,e:"時刻は It's + 時刻。half past three=3時30分。"},
{d:1,q:"A: Hello, this is Yumi.\nB: Hi, Yumi. ___",c:["How are you?","Who are you?","Where is it?","What is that?"],a:0,e:"あいさつがすんだら How are you? で調子を聞くと会話がつづく。"},
{d:1,q:"A: Can I use your eraser?\nB: Sure. ___",c:["Here you are.","Thank you.","You're welcome.","Excuse me."],a:0,e:"Sure.(もちろん)といってものを渡すときは Here you are.(はい、どうぞ)。"},
{d:1,q:"A: Good morning, everyone!\nB: ___",c:["Good morning, Ms. Sato!","Good night, Ms. Sato!","Good bye, Ms. Sato!","Take care, Ms. Sato!"],a:0,e:"朝のあいさつは Good morning. 先生などには Ms. などの呼びかけをつけると丁寧。"},
{d:2,q:"A: Could you pass the salt, please?\nB: ___",c:["Sure, here you are.","Yes, it is.","No, thanks.","I'd love to."],a:0,e:"Could you 〜? は丁寧なお願い。引き受けるときは Sure, here you are."},
{d:2,q:"A: I passed the English exam!\nB: ___",c:["Congratulations!","I'm sorry to hear that.","Good luck!","Take care."],a:0,e:"よい知らせには Congratulations!(おめでとう!)Good luck! はこれからがんばる人にかける言葉。"},
{d:2,q:"A: Would you like something to drink?\nB: ___",c:["Orange juice, please.","I like orange juice.","Orange juice is sweet.","I drank juice yesterday."],a:0,e:"Would you like 〜? は勧めの言葉。ほしいときは Orange juice, please. と注文のかたちで答える。"},
{d:2,q:"A: How about going to the movies tonight?\nB: ___",c:["I'd love to!","I saw it last week.","It's five hundred yen.","By bus, please."],a:0,e:"How about 〜?(〜はどう?)への乗り気な返事は I'd love to.(ぜひ!)"},
{d:2,q:"A: What's the matter? You look pale.\nB: ___",c:["I feel sick.","I got a present.","It's my birthday.","I won the game."],a:0,e:"顔色が悪そうと言われた理由は I feel sick.(気分が悪い)。"},
{d:2,q:"A: Can I help you?\nB: ___",c:["Yes. I'm looking for a gift.","No problem.","Help yourself.","You're welcome."],a:0,e:"店員さんの Can I help you? には探しているものを伝える。Help yourself. は「ご自由にどうぞ」。"},
{d:2,q:"A: What do you do in your free time?\nB: ___",c:["I play the guitar and read books.","At seven o'clock.","By myself.","Once a week."],a:0,e:"自由時間にすることを聞かれているので、習慣のことを一般動詞で答える。"},
{d:2,q:"A: Is it OK if I open the window?\nB: ___",c:["Sure, go ahead.","Yes, I am.","Thanks a lot.","I'm opening now."],a:0,e:"許可をたずねられたら Sure, go ahead.(どうぞやって)と返す。"},
{d:2,q:"A: I'm so hungry!\nB: ___",c:["Let's get something to eat.","Let's do our homework.","Let's clean the room.","Let's call the police."],a:0,e:"おなかがすいたら Let's get something to eat.(何か食べに行こう)"},
{d:2,q:"A: Thanks for walking my dog.\nB: ___",c:["Anytime!","I'm afraid so.","So am I.","Well done."],a:0,e:"Anytime!(いつでもいいよ)は感謝へのカジュアルな返事。"},
{d:2,q:"A: What's your favorite subject?\nB: ___",c:["Art. I love drawing.","Mr. Tanaka. He is kind.","Monday and Thursday.","In the art room."],a:0,e:"favorite subject は教科のこと。先生や曜日、場所ではない。"},
{d:2,q:"A: Sorry, what did you say?\nB: ___",c:["I said let's meet at noon.","You're welcome.","That's right.","Here we are."],a:0,e:"聞き返されたら言った内容をもう一度くり返す。"},
{d:3,q:"A: Excuse me, how can I get to the museum?\nB: ___",c:["Go straight and turn left at the second corner.","You should visit there once.","It costs eight dollars.","The museum is very old."],a:0,e:"道案内は Go straight(まっすぐ行く)/turn left(左に曲がる)などの表現で説明する。"},
{d:3,q:"A: Could you say that again more slowly?\nB: ___",c:["Of course. The meeting starts at six.","The room is on the second floor.","My name is Ken.","It's Tuesday today."],a:0,e:"「もう一度ゆっくり」たのまれたら承知して、言った内容をゆっくりくり返す。"},
{d:3,q:"A: What do you think of this T-shirt?\nB: ___",c:["It looks great on you!","Yes, it is a T-shirt.","I'm wearing shoes.","The shop closes at eight."],a:0,e:"意見を聞かれたら It looks ...(ように見える)で感想を伝える。"},
{d:3,q:"A: I'm afraid I can't come to your party.\nB: ___",c:["That's too bad. Maybe next time!","Congratulations!","You're welcome!","Sounds wonderful!"],a:0,e:"断られたら残念がりつつ次のチャンスをさそう。I'm afraid はやんわり断るときの言葉。"},
{d:3,q:"A: Do you mind if I sit here?\nB: ___",c:["Of course not. Go ahead.","Yes, I am.","No, thank you.","Yes, it is."],a:0,e:"mind(気にする)を使った許可の質問には Of course not.(全然気にしないよ)。Yes だと嫌な意味になるので注意!"},
{d:3,q:"A: How was your trip to Kyoto?\nB: ___",c:["It was wonderful. I want to go again.","It takes two hours by train.","Maybe next spring.","With my classmates."],a:0,e:"How was 〜? には体験の評価(It was wonderful.)で答える。時間や時期は別の質問への返事。"},
{d:3,q:"A: You speak English very well!\nB: ___",c:["Thank you. I study every day.","Yes, you speak English well.","My name is Ken.","It's my dictionary."],a:0,e:"英語圏ではほめられたら Thank you と素直にうけとるのがマナー。"},
{d:3,q:"A: Would you mind waiting a minute?\nB: ___",c:["No, not at all.","Yes, I am.","No, thank you.","Yes, it does."],a:0,e:"Would you mind 〜? は丁寧なお願い。OK の返事は No, not at all.(全然構わない)!"},
{d:3,q:"A: What time shall we meet tomorrow?\nB: ___",c:["How about at ten?","It's ten o'clock now.","I met him at ten.","We walked ten minutes."],a:0,e:"集合時刻を決めるときは How about 〜?(〜はどう?)を使うと自然。"},
{d:3,q:"A: I heard you broke your leg. How are you feeling?\nB: ___",c:["Much better, thank you.","The game starts at three.","My favorite color is blue.","Turn left at the bank."],a:0,e:"体調を聞かれたら Much better.(だいぶ良くなった)など自分の状態で答える。"},
{d:3,q:"A: May I take your order?\nB: ___",c:["Yes. I'll have a cheeseburger, please.","The waiter is very kind.","This table is small.","Lunch begins at eleven."],a:0,e:"May I take your order?(ご注文はお決まりですか)には I'll have 〜.(〜をください)で注文する。"},
{d:3,q:"A: I'm moving to Osaka next month.\nB: ___",c:["Really? I'll miss you!","Osaka Castle is beautiful.","I visited Osaka once.","It's south of Tokyo."],a:0,e:"引っ越しの報告には Really? I'll miss you.(寂しくなるなあ)のような気持ちをそえるのが自然。"}
],
station:[
{d:1,jp:"私は毎朝7時に起きます。",words:["I","get","up","at","seven","every morning"],e:"起きる=get up。時刻の前に at を置く(I get up at seven)。"},
{d:1,jp:"彼女は水泳が得意です。",words:["She","is","good","at","swimming"],e:"得意=be good at。at のあとは動名詞(-ing)。"},
{d:1,jp:"あなたはどこに住んでいますか。",words:["Where","do","you","live"],e:"場所の疑問詞 Where + do + 主語 + 動詞の順。"},
{d:1,jp:"これは私の本です。",words:["This","is","my","book"],e:"This is + 名詞で「これは〜です」。my=私の。"},
{d:1,jp:"彼は昨日サッカーをしました。",words:["He","played","soccer","yesterday"],e:"yesterday(昨日)があるので過去形 played。"},
{d:1,jp:"机の上に本が2冊あります。",words:["There","are","two","books","on","the","desk"],e:"There are + 数 + 名詞 + 場所(on the desk)の順番。"},
{d:1,jp:"私は犬が好きです。",words:["I","like","dogs"],e:"主語+動詞+目的語の基本の語順。好きなものが複数なら dogs。"},
{d:1,jp:"彼女は毎朝牛乳を飲みます。",words:["She","drinks","milk","every morning"],e:"三人称単数(She)なので drinks に s がつく。"},
{d:1,jp:"窓を閉めてください。",words:["Please","close","the","window"],e:"命令文は動詞の原形ではじめる。Please をつけるとていねい。"},
{d:1,jp:"彼はとても背が高いです。",words:["He","is","very","tall"],e:"「背が高い」は He is tall. very で「とても」をくわえる。"},
{d:1,jp:"私はバスで学校へ行きます。",words:["I","go","to","school","by","bus"],e:"交通手段は by bus / by car。「〜へ行く」は go to 〜。"},
{d:2,jp:"私の夢は医者になることです。",words:["My","dream","is","to","become","a","doctor"],e:"「〜すること」=to 不定詞。a doctor の a も忘れずに。"},
{d:2,jp:"彼女は歌うことが好きです。",words:["She","likes","to","sing"],e:"like to do / like doing どちらもOK。ここでは to sing。"},
{d:2,jp:"あなたはいつ英語を勉強しますか。",words:["When","do","you","study","English"],e:"疑問詞 When を最初に。あとはふつうの疑問文と同じ語順。"},
{d:2,jp:"その映画はとてもおもしろかったです。",words:["The","movie","was","very","interesting"],e:"be 動詞 + 形容詞。interesting は物事が「おもしろい」。"},
{d:2,jp:"私はテニスをするのを楽しんでいます。",words:["I","enjoy","playing","tennis"],e:"enjoy のあとは動名詞(-ing)。"},
{d:2,jp:"そこまで歩いて10分かかります。",words:["It","takes","ten","minutes","to","walk","there"],e:"It takes + 時間 + to do(〜するのに時間がかかる)。"},
{d:2,jp:"彼は背が高くて親切です。",words:["He","is","tall","and","kind"],e:"形容詞をつなぐ and。tall and kind の順が自然。"},
{d:2,jp:"どうやってその店に行きますか。",words:["How","do","I","get","to","the","store"],e:"道順を聞く How do I get to 〜?(〜へはどうやって行くの?)" },
{d:2,jp:"私たちの先生はとても親切です。",words:["Our","teacher","is","very","kind"],e:"Our(私たちの)+ 名詞。kind=親切な。"},
{d:2,jp:"彼女は今、昼ごはんを食べています。",words:["She","is","eating","lunch","now"],e:"今していること=現在進行形 is eating。now は文のおわりへ。"},
{d:2,jp:"週末に何をしましたか。",words:["What","did","you","do","last","weekend"],e:"過去の疑問文は did + 主語 + 動詞の原形。"},
{d:2,jp:"このかばんは私のです。",words:["This","bag","is","mine"],e:"「私のもの」は所有代名詞 mine(my bag = mine)。"},
{d:3,jp:"その知らせを聞いて、私はうれしかった。",words:["I","was","glad","to","hear","the","news"],e:"感情の言葉 + to 不定詞(be glad to do=できてうれしい)。"},
{d:3,jp:"雨がふっていたので、私は家にいました。",words:["I","stayed","home","because","it","was","raining"],e:"because のあとに理由の文。ふっていた=過去進行形 was raining。"},
{d:3,jp:"彼は私にその本を読むように言いました。",words:["He","told","me","to","read","the","book"],e:"tell 人 to do(人に〜するよう言う)。"},
{d:3,jp:"その山は日本でいちばん高い山です。",words:["That","mountain","is","the","highest","in","Japan"],e:"範囲が日本=in Japan。最上級 the highest。"},
{d:3,jp:"自転車を見せてもらえますか。",words:["Could","you","show","me","your","bike"],e:"Could you show me 〜?(見せてくれますか)show 人 もの。"},
{d:3,jp:"私は毎日練習しなければなりません。",words:["I","must","practice","every","day"],e:"must + 動詞の原形(〜しなければならない)。"},
{d:3,jp:"その公園は思っていたよりも広いです。",words:["The","park","is","bigger","than","I","expected"],e:"比較級 + than I expected(思っていたより)。"},
{d:3,jp:"宿題を終えたら遊びましょう。",words:["Let's","play","after","you","finish","your","homework"],e:"after + 主語 + 動詞で「〜したあとに」。"},
{d:3,jp:"何か熱い飲み物がほしいです。",words:["I","want","something","hot","to","drink"],e:"something + 形容詞 + to do。形容詞は後ろに置くのがルール!"},
{d:3,jp:"彼はクラスでいちばん背が高い。",words:["He","is","the","tallest","in","his","class"],e:"範囲がクラス=in his class。最上級 the tallest。"}

park:[
{d:1,t:'pic',say:"Ken plays soccer every Sunday.",s:["👦⚽","👦⚾","👦🏀","👦🎾"],a:0,e:"音声の内容「ケンは毎週日曜日にサッカーをします」。soccer=サッカー⚽"},
{d:1,t:'pic',say:"Mary is watering the flowers.",s:["🌸💧","🌸✂️","🌸👃","🌸🎁"],a:0,e:"watering the flowers=花に水をあげている。water は動詞でも使える!"},
{d:1,t:'pic',say:"My father is driving a car.",s:["👨🚗","👨🚲","👨🏊","👨🍳"],a:0,e:"driving a car=車を運転している。drive は運転する。"},
{d:1,t:'pic',say:"There are two apples on the table.",s:["🍎🍎🪑","🍌🍌🪑","🍇🍇🪑","🍓🍓🪑"],a:0,e:"two apples=りんご2つ。apples が複数なので There ARE。"},
{d:1,t:'pic',say:"Emily is wearing a crown.",s:["👧👑","👧🎩","👧🧣","👧👒"],a:0,e:"wearing a crown=王冠をかぶっている。crown=王冠、hat=帽子。"},
{d:1,t:'pic',say:"The bird is flying in the sky.",s:["🐦☁️","🐧❄️","🐔🏠","🦆💧"],a:0,e:"flying in the sky=空を飛んでいる。fly は飛ぶ。"},
{d:1,t:'pic',say:"Jack is brushing his teeth.",s:["🪥👦","🧼🛁👦","👕👔👦","🛏️😴👦"],a:0,e:"brushing his teeth=歯をみがいている。brush=みがく、teeth=tooth(歯)の複数形。"},
{d:1,t:'pic',say:"We eat lunch at noon.",s:["🕛🍱","🌅🍳","🌙🍛","🌃🍿"],a:0,e:"noon=正午(12時)。lunch は昼ごはん。"},
{d:1,t:'pic',say:"Lisa is talking on the phone.",s:["📞👧","📺👧","🎧👧","📖👧"],a:0,e:"talking on the phone=電話で話している。"},
{d:1,t:'pic',say:"The bus stops near the bank.",s:["🚌🏦","🚗🏪","✈️🏖️","🚲⛲"],a:0,e:"bank=銀行。bus stops near the bank=バスが銀行の近くにとまる。"},
{d:1,t:'pic',say:"Tom is sleeping on the sofa.",s:["😴🛋️","🍚🍴","⚽🏃","📚✏️"],a:0,e:"sleeping on the sofa=ソファでねている。sofa=ソファ。"},
{d:2,t:'qa',say:"Hi, Emma! Where are you going? I'm going to the library to return some books.",q:"Where is Emma going?",s:["To the library.","To the bookstore.","To her school.","To the park."],a:0,e:"return some books=本を返すために library(図書館)へ行きます。"},
{d:2,t:'qa',say:"Wow, what a big dog! Is it yours? Yes, my uncle gave him to me last month.",q:"Who gave the dog to the boy?",s:["His uncle.","His friend.","His teacher.","His grandmother."],a:0,e:"my uncle gave him to me=おじさんが犬をくれた、と言っています。"},
{d:2,t:'qa',say:"Do you want to play tennis this afternoon? I'd love to, but I have to practice the piano.",q:"What will the girl do this afternoon?",s:["Practice the piano.","Play tennis.","Watch a game.","Clean her room."],a:0,e:"I'd love to, but ...=行きたいけど、と断って piano の練習をしなければならないと言っています。"},
{d:2,t:'qa',say:"Excuse me, when does the museum open? At nine, but today it opens at ten because it's Monday.",q:"What time does the museum open today?",s:["At ten.","At nine.","At eleven.","At noon."],a:0,e:"ふだんは9時だけど、今日は月曜日なので10時開き(today it opens at ten)。"},
{d:2,t:'qa',say:"Mom, can I have some ice cream? Sure, but finish your vegetables first.",q:"What must the boy do first?",s:["Eat his vegetables.","Eat ice cream.","Wash his hands.","Set the table."],a:0,e:"finish your vegetables first=まず野菜を食べなさい、と言われています。"},
{d:2,t:'qa',say:"Your new bike looks cool! Thanks. I ride it to school every day now.",q:"How does the boy go to school?",s:["By bike.","By bus.","On foot.","By train."],a:0,e:"ride it to school every day=毎日自転車で学校へ行っています。"},
{d:2,t:'qa',say:"Are you good at swimming, Kate? Not really, but I enjoy it very much.",q:"What does Kate say about swimming?",s:["She enjoys it but isn't good at it.","She is very good at it.","She doesn't like it at all.","She never swims."],a:0,e:"Not really, but I enjoy it very much.=あまり得意じゃないけど大好き、という意味。"},
{d:2,t:'qa',say:"Let's make a cake for Dad's birthday. Great idea! I'll buy some strawberries.",q:"What will they make?",s:["A cake.","Cookies.","Pizza.","Salad."],a:0,e:"make a cake for Dad's birthday=お父さんの誕生日にケーキを作る、ということ。"},
{d:2,t:'qa',say:"Why were you late for school? I missed the bus, and I had to walk.",q:"Why was the girl late?",s:["She missed the bus.","She woke up late.","She forgot her homework.","She was sick."],a:0,e:"missed the bus=バスに乗りおくれたので歩いた、と言っています。"},

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let state=null;
function freshState(){return{v:3,g:GRID,townName:'',coins:50,placed:{},progress:{},roads:[],totalCorrect:0,totalAnswered:0,review:[],sound:true,lowGfx:false}}
function migrate(d){
 if(!d||typeof d!=='object')return null;
 const s=Object.assign(freshState(),d);
 s.v=3;
 if(typeof s.townName!=='string')s.townName='';
 if(!Array.isArray(s.review))s.review=[];
 const oldG=(typeof d.g==='number'&&d.g>0&&d.g<=20)?d.g:5;
 const remap=t=>{
  let c=t%oldG,r=Math.floor(t/oldG);
  c=Math.min(c,GRID-1);r=Math.min(r,GRID-1);
  return r*GRID+c;
 };
 const fixed={};
 Object.entries(s.placed||{}).forEach(([cat,p])=>{
  if(p&&typeof p.level==='number'){
   let t=0;
   if('lot' in p)t=Math.floor(p.lot/4)*oldG+(p.lot%4);
   else if('tile' in p)t=remap(p.tile);
   fixed[cat]={tile:Math.max(0,Math.min(GRID*GRID-1,t)),level:Math.max(1,Math.min(3,p.level))};
  }
 });
 s.placed=fixed;
 s.g=GRID;
 const occ=new Set(Object.values(s.placed).map(p=>p.tile));
 s.roads=[...new Set(
  (Array.isArray(s.roads)?s.roads:[]).filter(t=>Number.isInteger(t)&&t>=0)
   .map(t=>t<GRID*GRID&&oldG!==GRID?remap(t):t)
   .filter(t=>t>=0&&t<GRID*GRID&&!occ.has(t))
 )];
 return s;
}
function loadState(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return null;return migrate(JSON.parse(raw))}catch(e){return null}}

let actx=null;
function tone(f,dur,type,delay=0,vol=.12){try{const t=actx.currentTime+delay;const o=actx.createOscillator();const g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function sfx(name){
 if(!state.sound)return;
 try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();
 if(name==='ok'){tone(660,.1,'sine');tone(880,.14,'sine',.09)}
 else if(name==='ng'){tone(200,.2,'square',0,.05);tone(160,.22,'square',.08,.05)}
 else if(name==='coin'){tone(1250,.06,'triangle');tone(1650,.12,'triangle',.06)}
 else if(name==='level'){[523,659,784,1047].forEach((f,i)=>tone(f,.13,'triangle',i*.09))}
 }catch(e){}
}

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
const HAS_TTS='speechSynthesis' in window;
function speak(text,rate){
 return new Promise(res=>{
  if(!HAS_TTS)return res();
  try{
   speechSynthesis.cancel();
   const u=new SpeechSynthesisUtterance(text);
   const v=voices.find(x=>/en[-_]US/i.test(x.lang))||voices.find(x=>/^en/i.test(x.lang));
   if(v)u.voice=v;
   u.lang='en-US';u.rate=rate;u.pitch=1.05;
   u.onend=()=>res();u.onerror=()=>res();
   speechSynthesis.speak(u);
  }catch(e){res()}
 });
}

function confetti(n){
 const em=['🎉','✨','🌸','⭐','💖','🎊'];
 for(let i=0;i<n;i++){
  const s=document.createElement('span');
  s.className='confetti';
  s.textContent=em[Math.floor(Math.random()*em.length)];
  s.style.left=Math.random()*100+'vw';
  s.style.animationDuration=(1.6+Math.random()*1.4)+'s';
  s.style.fontSize=(18+Math.random()*16)+'px';
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),3200);
 }
}

   dummy.position.set(x+ox,.15,z+oz);
   dummy.rotation.set(0,side?Math.PI/2:0,0);
   dummy.updateMatrix();
   stripes.setMatrixAt(ci++,dummy.matrix);
  };
  if(r>0&&rd.includes((r-1)*GRID+c))add(false,0,-TILE*.27);
  if(r<GRID-1&&rd.includes((r+1)*GRID+c))add(false,0,TILE*.27);

 });

function onResize(){

let lastFrame=0;
function loop(t){
 if(!R.ok)return;
 requestAnimationFrame(loop);
 if(!R.renderVisible)return;
 if(t-lastFrame<33)return;
 lastFrame=t;
 R.clouds.forEach(c=>{
  c.position.x+=c.userData.speed*.033;
  if(c.position.x>24)c.position.x=-26;
 });
 for(let i=R.anims.length-1;i>=0;i--){
  const a=R.anims[i];
  a.t+=.033;
  const k=Math.min(1,a.t/.55);
  const c1=1.70158,c3=c1+1;
  const e=1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2);
  const s=k>=1?1:Math.max(.01,e);
  a.obj.scale.set(s,s,s);
  if(k>=1){
   a.obj.scale.set(1,1,1);
   freeze(a.obj);
   R.anims.splice(i,1);
  }
 }
 R.agents.forEach(a=>{
  a.p+=.033*a.speed;
  if(a.p>=1){
   const opts=neighborsRoad3D(a.toTile).filter(t=>t!==a.fromTile);
   if(opts.length){
    const nt=opts[Math.floor(Math.random()*opts.length)];
    a.fromTile=a.toTile;a.toTile=nt;a.p=0;
    const f=tileXY(a.fromTile),tt=tileXY(a.toTile);
    a.fx=f.x;a.fz=f.z;a.tx=tt.x;a.tz=tt.z;
    a.mesh.rotation.y=Math.atan2(-(tt.z-f.z),(tt.x-f.x));
   }else{
    a.p=.995;
   }
  }
  const kk=Math.min(a.p,.999);
  a.mesh.position.set(a.fx+(a.tx-a.fx)*kk,.02,a.fz+(a.tz-a.fz)*kk);
 });
 R.renderer.render(R.scene,R.camera);
}

function pickTile(e){

 R.ptr.x=((e.clientX-rect.left)/rect.width)*2-1;
 R.ptr.y=-((e.clientY-rect.top)/rect.height)*2+1;
 R.ray.setFromCamera(R.ptr,R.camera);
 const hits=R.ray.intersectObject(R.tiles);
 if(!hits.length)return null;
 const h=hits[0];
 return h.object.isInstancedMesh?h.instanceId:h.object.userData.tile;
}

 }

function bindSceneEvents(){
 const el=R.renderer.domElement;
 const ptrs=new Map();
 let downInfo=null,lastPinch=0,lastMid=null;
 el.addEventListener('contextmenu',e=>e.preventDefault());
 el.addEventListener('pointerdown',e=>{
  try{el.setPointerCapture(e.pointerId)}catch(err){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,btn:e.button});
  if(ptrs.size===1)downInfo={sx:e.clientX,sy:e.clientY,btn:e.button};
  if(ptrs.size===2){
   const[a,b]=[...ptrs.values()];
   lastPinch=Math.hypot(a.x-b.x,a.y-b.y);
   lastMid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
   downInfo=null;
  }
 });
 el.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)){handleHover(e);return}
  const p=ptrs.get(e.pointerId);
  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  p.x=e.clientX;p.y=e.clientY;
   if(ptrs.size===1&&downInfo){
    if(downInfo.btn===2||R.dragMode==='pan')panBy(dx,dy);
   else{
    R.cam.theta-=dx*.0055;
    R.cam.phi=Math.min(1.32,Math.max(.32,R.cam.phi-dy*.0045));
    updateCam();
   }
  }else if(ptrs.size===2){
   const[a,b]=[...ptrs.values()];
   const dnow=Math.hypot(a.x-b.x,a.y-b.y);
   const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
   if(lastMid)panBy(mx-lastMid.x,my-lastMid.y);
   if(lastPinch>0)R.cam.radius=Math.min(42,Math.max(10,R.cam.radius*lastPinch/dnow));
   lastPinch=dnow;lastMid={x:mx,y:my};
   updateCam();
  }
 });
 const up=e=>{
  ptrs.delete(e.pointerId);
  R.lastPtrUp=Date.now();
  if(ptrs.size<2){lastMid=null;lastPinch=0}
  if(ptrs.size===0&&downInfo){
   const dist=Math.hypot(e.clientX-downInfo.sx,e.clientY-downInfo.sy);
   if(dist<12)handleTap(e);
   downInfo=null;
  }
 };
 el.addEventListener('pointerup',up);
 el.addEventListener('pointercancel',up);
 el.addEventListener('wheel',e=>{
  e.preventDefault();
  R.cam.radius=Math.min(42,Math.max(10,R.cam.radius*(1+e.deltaY*.0012)));
  updateCam();
 },{passive:false});
 el.addEventListener('click',e=>{
  if(Date.now()-(R.lastPtrUp||0)<600)return;
  handleTap(e);
 });
 if(!window.PointerEvent){
  const tp=new Map();
  let td=null,tpinch=0,tmid=null;
  el.addEventListener('touchstart',e=>{
   e.preventDefault();
   R.usedTouch=true;
   for(const t of e.changedTouches)tp.set(t.identifier,{x:t.clientX,y:t.clientY});
   if(tp.size===1){const t=e.changedTouches[0];td={sx:t.clientX,sy:t.clientY,x:t.clientX,y:t.clientY}}
   else{td=null}
   if(tp.size===2){const v=[...tp.values()];tpinch=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);tmid={x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}}
  },{passive:false});
  el.addEventListener('touchmove',e=>{
   e.preventDefault();
   let ddx=0,ddy=0;
   for(const t of e.changedTouches){
    const p=tp.get(t.identifier);
    if(!p)continue;
    ddx=t.clientX-p.x;ddy=t.clientY-p.y;
    p.x=t.clientX;p.y=t.clientY;
   }
   if(tp.size===1&&td){
    td.x+=ddx;td.y+=ddy;
    R.cam.theta-=ddx*.0055;
    R.cam.phi=Math.min(1.32,Math.max(.32,R.cam.phi-ddy*.0045));
    updateCam();
   }else if(tp.size===2){
    const v=[...tp.values()];
    const dn=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);
    const mx=(v[0].x+v[1].x)/2,my=(v[0].y+v[1].y)/2;
    if(tmid)panBy(mx-tmid.x,my-tmid.y);
    if(tpinch>0)R.cam.radius=Math.min(42,Math.max(10,R.cam.radius*tpinch/dn));
    tpinch=dn;tmid={x:mx,y:my};
    updateCam();
   }
  },{passive:false});
  const tend=e=>{
   for(const t of e.changedTouches)tp.delete(t.identifier);
   if(tp.size<2){tmid=null;tpinch=0}
   if(tp.size===0&&td){
    R.lastPtrUp=Date.now();
    const dist=Math.hypot(td.x-td.sx,td.y-td.sy);
    if(dist<12)handleTap({clientX:td.x,clientY:td.y});
    td=null;
   }
  };
  el.addEventListener('touchend',tend);
  el.addEventListener('touchcancel',tend);
 }
}

 });
 const qs=[];const used=new Set();
 for(let k=0;k<len;k++){
  const d=pickDifficulty(level,Math.random());
  let cand=shuffle(poolByD[d]).filter(o=>!used.has(o.idx));
  if(!cand.length)cand=shuffle(poolByD[d===3?2:d===2?1:3]).filter(o=>!used.has(o.idx));
  if(!cand.length)cand=shuffle(poolByD[d]);
  const pick=cand[0];
  used.add(pick.idx);
  qs.push({cat,idx:pick.idx,q:pick.q});
 }
 return{cat,isReview:false,i:0,streak:0,coinsEarned:0,log:[],results:[],qs};
}

function startSession(cat,isReview){
 exitPlace();closeModal();
 session=buildSession(cat,isReview);
 $('#q-building').textContent=isReview?'📖 ふくしゅう':`${B[cat].emoji} ${B[cat].name} Lv.${state.placed[cat].level}`;
 show('scr-quiz');
 renderQuestion();
}

function updateDots(){
 const box=$('#q-dots');
 box.innerHTML=session.qs.map((_,k)=>{
  let c='dot';
  if(k<session.i)c+=session.results[k]?' done-ok':' done-ng';
  if(k===session.i)c+=' now';
  return`<span class="${c}"></span>`;
 }).join('');
 const st=$('#q-streak');
 if(session.streak>=2&&!session.isReview){st.textContent=`🔥 ${session.streak} れんぞく!`;st.classList.remove('hidden')}
 else st.classList.add('hidden');
}

function feedbackHTML(ok,exp,extra=''){
 return`<div class="feedback ${ok?'good':'bad'}">
  <div class="fb-head">${ok?'⭕️ せいかい!':'❌️ ざんねん…'}</div>
  <div class="fb-exp">${exp}${extra?('<br>'+extra):''}</div>
  <div class="fb-next"><button class="btn lavvy" id="fb-next">${session.i<session.qs.length-1?'つぎへ ▶':'結果をみる 🎉'}</button></div>
 </div>`;
}
function bindFeedback(ok){
 $('#fb-next').onclick=()=>{
  session.i++;
  if(session.i>=session.qs.length)finishSession();
  else renderQuestion();
 };
}

function addCoins(n){
 state.coins+=n;
 session.coinsEarned+=n;
 refreshHUD();
 if(n>0)sfx('coin');
}
function recordResult(ok,baseCoins,label){
 session.results[session.i]=ok;
 state.totalAnswered++;
 let amount=0;
 if(ok){
  state.totalCorrect++;
  if(session.isReview){
   amount=4;
   state.review=state.review.filter(x=>x!==session.qs[session.i].id);
  }else{
   session.streak++;
   amount=baseCoins+(session.streak>=2?Math.min(session.streak-1,4)*2:0);
   const cat=session.qs[session.i].cat;
   state.progress[cat]=(state.progress[cat]||0)+1;
  }
 }else{
  session.streak=0;
  if(!session.isReview&&session.qs[session.i].cat!=='flower'){
   const id=session.qs[session.i].cat+':'+session.qs[session.i].idx;
   if(!state.review.includes(id))state.review.push(id);
  }
 }
 session.log.push({label:`Q${session.i+1} ${label}`,amount});
 addCoins(amount);
 save();
}

function renderQuestion(){
 updateDots();
 const item=session.qs[session.i];
 const q=item.q;
 const zone=$('#q-answer-zone');
 const card=$('#q-card');
 if(item.cat==='flower')return renderWriting(card,zone,item);
 if(item.cat==='station')return renderOrder(card,zone,item);
 if(q.t==='pic')return renderListening(card,zone,item,true);
 if(q.t==='qa')return renderListening(card,zone,item,false);
 return renderChoice(card,zone,item);
}

function renderChoice(card,zone,item){
 const q=item.q;
 card.innerHTML=`<span class="qcat-tag">${CAT_TAG[item.cat]}</span>
 <div class="qtext">${q.q.replace(/_{2,}/g,'<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>').replace(/\n/g,'<br>')}</div>`;
 const opts=shuffle(q.c.map((t,k)=>({t,ok:k===q.a})));
 zone.innerHTML=`<div class="choices panel" style="margin-top:14px;background:transparent;border:none;box-shadow:none;padding:0">
 ${opts.map((o,k)=>`<button class="choice" data-ok="${o.ok}"><span class="ckey">${'ABCD'[k]}</span>${o.t}</button>`).join('')}
 </div>`;
 zone.querySelectorAll('.choice').forEach(btn=>{
  btn.onclick=()=>{
   const ok=btn.dataset.ok==='true';
   zone.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.ok==='true')b.classList.add('ok')});
   if(!ok)btn.classList.add('ng');
   sfx(ok?'ok':'ng');
   recordResult(ok,3+2*q.d,'正解ボーナス');
   updateDots();
   zone.insertAdjacentHTML('beforeend',feedbackHTML(ok,q.e));
   bindFeedback(ok);
   $('#fb-next').focus();
  };
 });
}

function renderOrder(card,zone,item){
 const q=item.q;
 card.innerHTML=`<span class="qcat-tag">🚉 じゅんじょにならべよう</span>
 <div class="qtext">${q.jp}</div>
 <div class="qjp">単語をタップして、正しい英語の文を作ろう!</div>`;
 let chips=shuffle(q.words.map((w,k)=>({w,id:k})));
 if(chips.every(c=>norm(c.w)===norm(q.words[chips.indexOf(c)])))chips=shuffle(chips);
 const selected=[];
 zone.innerHTML=`<div class="panel" style="margin-top:14px;padding:18px">
  <div class="order-slots" id="or-slots"><span class="ph">ここにタップした単語が並ぶよ</span></div>
  <div class="order-bank" id="or-bank"></div>
  <div class="fb-next"><button class="btn minty" id="or-check" disabled>これで決定!✔</button>
  <button class="btn ghosty small" id="or-clear">やりなおす</button></div></div>`;
 function paintBank(){
  $('#or-bank').innerHTML=chips.map(c=>`<button class="chip ${c.used?'hidden':''}" data-id="${c.id}">${c.w}</button>`).join('');
  $('#or-bank').querySelectorAll('.chip').forEach(b=>{
   b.onclick=()=>{
    const c=chips.find(x=>String(x.id)===b.dataset.id);
    if(c.used)return;
    c.used=true;selected.push(c);
    sfx('coin');
    paintSlots();
   };
  });
 }
 function paintSlots(){
  $('#or-slots').innerHTML=selected.length?selected.map((c,k)=>`<button class="chip in-slot" data-k="${k}">${c.w}</button>`).join('')
   :'<span class="ph">ここにタップした単語が並ぶよ</span>';
  $('#or-slots').querySelectorAll('.chip').forEach(b=>{
   b.onclick=()=>{
    const k=Number(b.dataset.k);
    selected[k].used=false;
    selected.splice(k,1);
    paintSlots();
   };
  });
  $('#or-check').disabled=selected.length!==q.words.length;
 }
 paintBank();paintSlots();
 $('#or-clear').onclick=()=>{selected.forEach(c=>c.used=false);selected.length=0;paintBank();paintSlots()};
 $('#or-check').onclick=()=>{
  const ans=selected.map(c=>norm(c.w)).join(' ');
  const ok=ans===norm(q.words.join(' '));
  sfx(ok?'ok':'ng');
  recordResult(ok,3+2*q.d,'並べかえボーナス');
  $('#or-check').disabled=true;
  $('#or-clear').disabled=true;
  $('#or-bank').style.pointerEvents='none';
  const extra=ok?'':'<br>正解: <b>'+q.words.join(' ')+'</b>';
  zone.querySelector('.panel').insertAdjacentHTML('beforeend',feedbackHTML(ok,q.e,extra));
  bindFeedback(ok);
 };
}

function rateFor(d){return d<=1?.85:d===2?.95:1.02}
function renderListening(card,zone,item,isPic){
 const q=item.q;
 const transcript=isPic?q.say:(item.cat==='park'?q.say:'');
 card.innerHTML=`<span class="qcat-tag">👂 ちょうかいクイズ</span>
 <div class="speak-zone">
  <button class="speak-btn" id="speak-btn">🔊</button>
  <span class="speak-hint">おして音を聞こう!なんどでも聞けるよ(はやさも変わるよ)</span>
 </div>
 ${!HAS_TTS?'<div class="feedback bad" style="margin:8px 12px"><div class="fb-exp">⚠️ このブラウザでは音が出ないみたい…下の文章を読んで答えてね!</div></div><div class="qjp" style="font-size:17px">'+transcript+'</div>':''}
 ${isPic?'':`<div class="qtext" style="font-size:min(4.8vw,22px);margin-top:10px">${q.q}</div>`}`;
 zone.innerHTML=isPic
 ?`<div class="pic-grid panel" style="background:transparent;border:none;box-shadow:none;padding:0">
   ${shuffle(q.s.map((t,k)=>({t,ok:k===q.a}))).map(o=>`<button class="pic" data-ok="${o.ok}">${o.t}</button>`).join('')}</div>`
 :`<div class="choices panel" style="margin-top:14px;background:transparent;border:none;box-shadow:none;padding:0">
   ${shuffle(q.s.map((t,k)=>({t,ok:k===q.a}))).map((o,k)=>`<button class="choice" data-ok="${o.ok}"><span class="ckey">${'ABCD'[k]}</span>${o.t}</button>`).join('')}</div>`;
 const spBtn=$('#speak-btn');
 let playCount=0;
 async function play(){
  if(spBtn.disabled)return;
  spBtn.classList.add('playing');
  await speak(q.say,rateFor(q.d));
  spBtn.classList.remove('playing');
 }
 spBtn.onclick=play;
 setTimeout(play,350);
 zone.querySelectorAll('.choice,.pic').forEach(btn=>{
  btn.onclick=async()=>{
   const ok=btn.dataset.ok==='true';
   zone.querySelectorAll('.choice,.pic').forEach(b=>{b.disabled=true;if(b.dataset.ok==='true')b.classList.add('ok')});
   if(!ok)btn.classList.add('ng');
   sfx(ok?'ok':'ng');
   recordResult(ok,3+2*q.d,'リスニングボーナス');
   updateDots();
   zone.insertAdjacentHTML('beforeend',
    `<details style="margin-top:10px;text-align:center;font-size:13px;color:var(--ink-soft)"><summary style="cursor:pointer">🔊 音声の文章をみる</summary><div class="panel" style="margin-top:8px;padding:12px;font-weight:700">${transcript}<br><span style="color:var(--pink-d)">訳) ${q.e.split('=')[1]||''}</span></div></details>`);
   zone.insertAdjacentHTML('beforeend',feedbackHTML(ok,q.e));
   bindFeedback(ok);
   await speak(q.say,rateFor(q.d));
  };
 });
}

function wordCount(s){return s.trim()?s.trim().split(/\s+/).filter(Boolean).length:0}

function renderWriting(card,zone,item){
 const q=item.q;
 card.innerHTML=`<span class="qcat-tag">✏️ ライティング</span>
 <div class="qtext" style="font-size:min(4.8vw,23px)">${q.en}</div>
 <div class="qjp">${q.jp}</div>
 <div class="qjp" style="margin-top:8px">💡 ヒント: ${q.hints.join(' / ')}</div>`;
 zone.innerHTML=`<div class="panel" style="margin-top:14px">
  <textarea class="writebox" id="wr-box" placeholder="Write your answer here..."></textarea>
  <div class="writing-meta"><span>目標は 15〜25語!</span><span id="wr-count">0 語</span></div>
  <div class="fb-next"><button class="btn lavvy big" id="wr-submit" disabled>できたら提出!📮</button></div>
  <div id="wr-checkzone"></div></div>`;
 const box=$('#wr-box'),cnt=$('#wr-count'),sub=$('#wr-submit');
 box.addEventListener('input',()=>{
  const n=wordCount(box.value);
  cnt.textContent=n+' 語';
  cnt.className=n>=15?(n<=25?'over':'over'):'';
  sub.disabled=n<3;
 });
 sub.onclick=()=>{
  const n=wordCount(box.value);
  box.disabled=true;sub.disabled=true;sub.textContent='提出ずみ ✔';
  $('#wr-checkzone').innerHTML=`
   <div style="margin-top:16px;padding:14px;border-radius:16px;background:var(--sun-l);border:2px solid #ffe6a8">
    <div style="font-weight:900;margin-bottom:6px">🌟 お手本の答え</div>
    <div style="font-size:15px;line-height:1.7">${q.sample}</div>
    <div style="font-size:13px;color:var(--ink-soft);margin-top:6px">(約 ${wordCount(q.sample)} 語)</div>
   </div>
   <div style="font-weight:900;margin-top:16px;text-align:center">じぶんの答えをチェックしてね!</div>
   <div class="checklist" id="wr-checks">${CHECKS.map((c,k)=>`<label class="checkrow"><input type="checkbox" data-k="${k}">${c}</label>`).join('')}</div>
   <div class="fb-next"><button class="btn pinky big" id="wr-done">コインをもらってつぎへ 💰</button></div>`;
  $('#wr-checks').querySelectorAll('input').forEach(inp=>{
   inp.onchange=()=>inp.closest('.checkrow').classList.toggle('checked',inp.checked);
  });
  $('#wr-done').onclick=()=>{
   const checks=$('#wr-checks').querySelectorAll('input:checked').length;
   sfx(checks>=2?'ok':'ng');
   recordResult(checks>=2,5+checks*5,'✍️ 作文ボーナス');
   updateDots();
   $('#wr-checkzone').insertAdjacentHTML('beforeend',feedbackHTML(checks>=2,q.e+'<br>お手本と見くらべて、直したいところがあれば直しておこう!'));
   bindFeedback(checks>=2);
  };
 };
}

function finishSession(){
 const n=session.qs.length;
 const correct=session.results.filter(Boolean).length;
 if(!session.isReview&&correct===n&&n>=3){addCoins(10);session.log.push({label:'🎉 パーフェクトボーナス',amount:10});save()}
 if(!session.isReview&&(state.roads||[]).length){
  const connected=Object.keys(state.placed).filter(c=>neighborsRoad(state.placed[c].tile).length>0).length;
  if(connected>0){
   const amt=connected*2;
   addCoins(amt);
   session.log.push({label:`🚗 道路ボーナス(そばに道のある建物×${connected})`,amount:amt});
   save();
  }
 }
 show('scr-result');
 const perfect=correct===n&&n>=3;
 $('#res-title').textContent=session.isReview?'📖 ふくしゅうクリア!':perfect?'パーフェクト!! すごい!':correct>=Math.ceil(n/2)?'よくできました!':'あと少し!がんばろう!';
 $('#res-stars').innerHTML=('⭐'.repeat(correct)+'☆'.repeat(n-correct));
 $('#res-coins').textContent=session.coinsEarned;
 $('#res-detail').innerHTML=session.log.map(l=>`<div><span>${l.label}</span><span>+${l.amount} 💰</span></div>`).join('');
 const pw=$('#res-progress-wrap');
 const lb=$('#levelup-banner');
 if(session.isReview||!session.cat){
  pw.classList.add('hidden');lb.classList.add('hidden');
 }else{
  const b=B[session.cat],p=state.placed[session.cat],cur=state.progress[session.cat]||0;
  pw.classList.remove('hidden');
  if(p.level<3){
   const target=TH[p.level];
   $('#res-progress-label').textContent=`${b.emoji} ${b.name} Lv.${p.level}`;
   $('#res-progress-num').textContent=Math.min(cur,target)+' / '+target;
   setTimeout(()=>{$('#res-progress-fill').style.width=Math.min(100,cur/target*100)+'%'},80);
  }else{
   $('#res-progress-label').textContent=`${b.emoji} ${b.name} Lv.MAX`;
   $('#res-progress-num').textContent='';
   setTimeout(()=>{$('#res-progress-fill').style.width='100%'},80);
  }
  if(canUpgrade(session.cat)){
   lb.classList.remove('hidden');
   $('#levelup-text').textContent=`${b.name}をタップして、レベルアップしよう!`;
   confetti(30);sfx('level');
  }else lb.classList.add('hidden');
 }
 if(perfect&&!lb||perfect&&lb.classList.contains('hidden'))confetti(26);
 save();
}

function startReview(){
 if(!state.review.length){toast('ふくしゅうする問題はないよ!');return}
 startSession(null,true);
}

function goHome(){
 exitPlace();
 if(session&&session.i<session.qs.length){
  askYesNo('まちにもどる?','クイズの途中だけど、やめてまちへもどる?','もどる',()=>{session=null;if(HAS_TTS)speechSynthesis.cancel();show('scr-town');renderMap()});
 }else{
  session=null;show('scr-town');renderMap();
 }
}

function wipeAndRestart(){
 try{localStorage.removeItem(SAVE_KEY)}catch(e){}
 exitPlace();
 if(HAS_TTS){try{speechSynthesis.cancel()}catch(e){}}
 session=null;
 state=freshState();
 freshStart=true;
 closeModal();
 $('#start-btn').textContent='▶️ はじめる!';
 $('#start-btn').className='btn pinky big';
 show('scr-title');
 refreshHUD();
 toast('データを消したよ!はじめからがんばろう♪');
}
function applyGfx(){
 if(!R.renderer)return;
 R.renderer.setPixelRatio(state.lowGfx?1:Math.min(window.devicePixelRatio||1,1.5));
 if(R.sun){
  const want=state.lowGfx?1024:2048;
  if(R.sun.shadow.mapSize.x!==want){
   R.sun.shadow.mapSize.set(want,want);
   if(R.sun.shadow.map){R.sun.shadow.map.dispose();R.sun.shadow.map=null}
   R.sun.shadow.needsUpdate=true;
  }
 }
 onResize();
}
function openSettings(){
 const snd=state.sound?'🔔 効果音:ON':'🔕 効果音:OFF';
 const gfx=state.lowGfx?'🖼️ 画面: 軽いモード':'🖼️ 画面: きれい';
 openModal(`<h3>⚙️ せってい</h3><p class="sub">まちの設定をかえられるよ</p>
 <div class="close-row" style="flex-direction:column">
 <button class="btn lavvy big" id="st-help">❓ 遊び方をみる</button>
 <button class="btn ghosty big" id="st-gfx">${gfx}</button>
 <button class="btn ghosty big" id="st-sound">${snd}</button>
 <button class="btn ghosty" id="st-reset">💾 データを消して最初から</button>
 <button class="btn pinky small" onclick="closeModal()">とじる</button>
 </div>`);
 $('#st-help').onclick=openTutorial;
 $('#st-gfx').onclick=()=>{
  state.lowGfx=!state.lowGfx;
  save();
  applyGfx();
  toast(state.lowGfx?'軽いモードにしたよ!':'きれいモードにしたよ!');
  openSettings();
 };
 $('#st-sound').onclick=()=>{state.sound=!state.sound;save();refreshHUD();openSettings()};
 $('#st-reset').onclick=()=>askYesNo('データを消す?','いままでの街・おかね・きろくが全部消えて、最初の画面にもどるよ。いい?','消して最初から',wipeAndRestart);
}
$('#start-btn').onclick=()=>{
 if(freshStart){freshStart=false;openNaming(true);return}
 show('scr-town');renderMap();
};
$('#rename-btn').onclick=()=>openNaming(false);
$('#build-open').onclick=()=>openPalette();
$('#settings-btn').onclick=openSettings;
$('#how-btn-title').onclick=openTutorial;
$('#cam-reset').onclick=()=>{
 R.cam={theta:.78,phi:1.02,radius:23};
 R.target={x:0,z:0};
 if(R.ok)updateCam();
 toast('視点をもどしたよ!');
};
$('#pan-toggle').onclick=()=>{
 R.dragMode=R.dragMode==='pan'?'orbit':'pan';
 $('#pan-toggle').textContent=R.dragMode==='pan'?'🖐️':'🔄';
 toast(R.dragMode==='pan'?'ドラッグで街をスライドできるよ!':'ドラッグで視点をまわすモードにしたよ');
 refreshSceneHint();
};
$('#reset-btn-top').onclick=()=>askYesNo('データをけす?','いままでの街と記録がぜんぶ消えてしまうけどいい?','消して最初から',wipeAndRestart);
$('#sound-btn').onclick=()=>{state.sound=!state.sound;save();refreshHUD();if(state.sound)sfx('coin')};
$('#review-btn').onclick=startReview;
$('#home-btn').onclick=goHome;
$('#res-town-btn').onclick=()=>{session=null;show('scr-town');renderMap()};

(function init(){
 state=loadState();
 freshStart=!state;
 if(!state)state=freshState();
 try{
  if(freshStart&&window.matchMedia&&matchMedia('(pointer:coarse)').matches){
   state.lowGfx=true;
  }
 }catch(e){}
 refreshHUD();
 if(!freshStart){
  $('#start-btn').textContent='▶️ つづきから!';
  $('#start-btn').className='btn minty big';
  $('#reset-btn-top').classList.remove('hidden');
 }
})();
</script>
</body>
</html>
